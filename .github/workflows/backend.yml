name: Backend CI/CD

# Runs on PRs to main/development (lint + tests) and on pushes to main (lint +
# tests → deploy). Path filter: only triggers when backend code or this
# workflow changes.
on:
  # Run checks on EVERY PR to main/development so the required "checks" status
  # always reports. (A path-filtered required check deadlocks PRs that don't
  # touch backend/**.) Also covers development so work merged there — not just
  # the eventual main PR — gets validated, including the isolation proof.
  pull_request:
    branches: [main, development]
  # Only deploy when the backend (or this workflow) actually changes.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  # ── CI: lint + tests. Runs on every PR and push. ───────────────────────────
  checks:
    runs-on: ubuntu-latest

    # A throwaway Postgres so the app can boot and create its tables.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: test-secret-for-ci   # app.main requires this at import time

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  # ── CD: deploy to Cloud Run. Only on push to main, after checks pass. ───────
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/742836129132/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@esportorium.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy esportorium-backend \
            --source backend \
            --region asia-southeast1 \
            --project esportorium \
            --allow-unauthenticated \
            --quiet
