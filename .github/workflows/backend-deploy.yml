name: Backend CI/CD

# Runs on PRs to main (checks only) and on pushes to main (checks → deploy).
# Path filter: only triggers when backend code or this workflow changes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  # ── CI: lint + verify the Docker image builds. Runs on every PR and push. ──
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Verify Docker image builds
        run: docker build -t esportorium-backend:ci .

  # ── CD: deploy to Cloud Run. Only on push to main, only if checks passed. ──
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/742836129132/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@esportorium.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy esportorium-backend \
            --source backend \
            --region asia-southeast1 \
            --project esportorium \
            --quiet
