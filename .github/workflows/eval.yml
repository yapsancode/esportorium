name: Eval gate

# Runs on PRs that touch the ingest prompt, service, guardrails, or the eval
# fixtures/runner themselves. Red = merge blocked, same as the lint/test gates.
#
# Requires one repository secret:
#   GOOGLE_API_KEY — Gemini API key (Settings → Secrets → Actions → New secret)
#
# The job calls the live Gemini API against 25 text fixtures (~$0.01 per run at
# Flash-Lite pricing). Skips automatically on branches that don't touch these paths.

on:
  pull_request:
    branches: [main, development]
    paths:
      - 'backend/app/services/ingest.py'
      - 'backend/app/services/guardrails.py'
      - 'backend/app/schemas/ingest.py'
      - 'backend/eval/**'

jobs:
  eval:
    # Prompt version and threshold are printed in the run output (run_eval.py
    # header) — not hardcoded here where they'd go stale.
    name: Ingest eval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      INGEST_MODEL: gemini-2.5-flash-lite
      INGEST_FALLBACK_MODEL: gemini-2.5-flash
      # JWT_SECRET and DATABASE_URL are NOT needed — run_eval.py only imports
      # app.services.ingest and app.schemas.ingest, which have no DB dependency.

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval gate
        run: python eval/run_eval.py --threshold 0.85
        # Exit 0 = PASS (accuracy >= 85%)
        # Exit 1 = FAIL (accuracy < 85%) — blocks merge
        # Exit 2 = config error (missing GOOGLE_API_KEY or broken import)
