[pytest]
# `live` tests make a real, billed LLM API call. They are excluded by default so
# that a plain `pytest` run — locally or in CI — never costs money. Run them
# deliberately with:  pytest -m live -s
#
# Registering the marker here also silences the unknown-mark warning that
# test_growth_nodes.py previously had to filter itself.
markers =
    live: makes a real, billed LLM API call (manual; excluded by default)

addopts = -m "not live"
